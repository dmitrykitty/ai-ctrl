# Named provider-state and proxy lifecycle adapted from agent-sandbox's
# compose/base.yml and claude/cli/agent.yml. MIT; see LICENSE.agent-sandbox.
name: aictrl-auth
services:
  auth-proxy:
    image: aictrl-base:py3.12.15-t01
    entrypoint: [python, /etc/aictrl/auth-proxy.py]
    user: "501:501"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    volumes:
      - type: bind
        source: ./auth-proxy.py
        target: /etc/aictrl/auth-proxy.py
        read_only: true
        bind:
          create_host_path: false
    networks:
      auth-internal:
        ipv4_address: 172.30.88.2
      auth-upstream: {}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 10
  claude-login:
    image: aictrl-claude:2.1.285-t01
    command: [claude, auth, login, --claudeai]
    cap_drop: [ALL]
    # Available only to trusted bootstrap; setpriv drops every capability.
    cap_add: [NET_ADMIN, NET_RAW, SETUID, SETGID, SETPCAP, CHOWN, FOWNER]
    security_opt: [no-new-privileges:true]
    init: true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    stdin_open: true
    tty: true
    environment:
      AICRTL_BOOTSTRAP_MODE: auth
      AICRTL_PROXY_IP: 172.30.88.2
      CLAUDE_CONFIG_DIR: /home/dev/.claude
      HTTP_PROXY: http://auth-proxy:8080
      HTTPS_PROXY: http://auth-proxy:8080
      NO_PROXY: localhost,127.0.0.1
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      DISABLE_AUTOUPDATER: "1"
      DISABLE_UPDATES: "1"
      ENABLE_CLAUDEAI_MCP_SERVERS: "false"
    extra_hosts:
      auth-proxy: 172.30.88.2
    volumes:
      - claude-state:/home/dev/.claude
    networks: [auth-internal]
    depends_on:
      auth-proxy:
        condition: service_healthy
networks:
  auth-internal:
    internal: true
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.30.88.0/24
  auth-upstream: {}
volumes:
  claude-state:
    external: true
    name: aictrl-claude-state
